{% load static %}

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}" />
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
    {% comment %} <script defer src="{% static 'js/tailwindcss.min.js' %}"></script> {% endcomment %}

    <title>
      {% block title %}
        Tiket Keluhan
      {% endblock %}
    </title>
  </head>
  <body>

    <div id="content">
      {% block content %}

      {% endblock %}
    </div>
    <script src="{% static 'js/bootstrap.bundle.js' %}" ></script>
  </body>
</html>

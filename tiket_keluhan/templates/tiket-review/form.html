{% extends 'form_layout.html' %}
{% load static %}

{% block card_header %}
  <div>
    <a href="{{ request.META.HTTP_REFERER }}" role="button" class="btn btn-light">Back</a>
  </div>
{% endblock %}

{% block form %}
  <style>
    .ratting:hover {
      transform: scale(1.2);
      transition: all;
      cursor: pointer;
    }
  </style>
  <div>
    <form class="mt-3" action="" method="POST">
      {% csrf_token %}
      <h3 class="text-center">Review Tiket</h3>
      <div class="row mb-2">
        <div class="mb-2 col-6">
          <label for="tiket_no" class="form-label">No Tiket</label>
          <input type="text" id="tiket_no" name="tiket" value="#{{ tiket }}" class="form-control" disabled />
        </div>
        <div class="mb-2 col-6">
          <label for="tiket_sub" class="form-label">Tiket Subject</label>
          <input type="text" id="tiket_sub" name="tiket_sub" value="{{ tiket.subject }}" class="form-control" disabled />
        </div>
        <div class="mb-2 col-6">
          <label class="form-label">Rating</label>
          <div class="d-flex justify-content-start">
            <div class="form-check form-check-inline">
              <input class="form-check-input" style="display: none;" type="radio" name="rating" id="rating1" value="1" />
              <label class="form-check-label ratting" for="rating1">
                <img src="{% static 'assets/icons/star_outline.svg' %}" alt="star 1" style="width: 2rem;" />
                <img src="{% static 'assets/icons/star_fill.svg' %}" alt="star 1" style="width: 2rem; display: none;" />
              </label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" style="display: none;" type="radio" name="rating" id="rating2" value="2" />
              <label class="form-check-label ratting" for="rating2">
                <img src="{% static 'assets/icons/star_outline.svg' %}" alt="star 1" style="width: 2rem;" />
                <img src="{% static 'assets/icons/star_fill.svg' %}" alt="star 1" style="width: 2rem; display: none;" />
              </label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" style="display: none;" type="radio" name="rating" id="rating3" value="3" />
              <label class="form-check-label ratting" for="rating3">
                <img src="{% static 'assets/icons/star_outline.svg' %}" alt="star 1" style="width: 2rem;" />
                <img src="{% static 'assets/icons/star_fill.svg' %}" alt="star 1" style="width: 2rem; display: none;" />
              </label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" style="display: none;" type="radio" name="rating" id="rating4" value="4" />
              <label class="form-check-label ratting" for="rating4">
                <img src="{% static 'assets/icons/star_outline.svg' %}" alt="star 1" style="width: 2rem;" />
                <img src="{% static 'assets/icons/star_fill.svg' %}" alt="star 1" style="width: 2rem; display: none;" />
              </label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" style="display: none;" type="radio" name="rating" id="rating5" value="5" />
              <label class="form-check-label ratting" for="rating5">
                <img src="{% static 'assets/icons/star_outline.svg' %}" alt="star 1" style="width: 2rem;" />
                <img src="{% static 'assets/icons/star_fill.svg' %}" alt="star 1" style="width: 2rem; display: none;" />
              </label>
            </div>
          </div>
        </div>
        <div class="col-6">
          <label for="">Status</label>
          <select name="action_status" id="" class="form-select">
            <option value="">Approve</option>
            <option value="reject">Reject</option>
          </select>
        </div>
        {{ form.as_p }}
      </div>
      <div class="d-flex gap-2 justify-content-between">
        <button type="reset" style="width: 100%;" class="btn btn-light border border-dark w-full">Clear Form</button>
        <button type="submit" style="width: 100%;" class="btn btn-primary border w-full">Submit</button>
      </div>
    </form>
  </div>
{% endblock %}

{% block script %}
  <script>
    $(document).ready(function () {

      function resetStarLabel() {
        // reset semua bintang ke outline
        $('.ratting img:nth-child(1)').show() // outline
        $('.ratting img:nth-child(2)').hide() // fill
      }
    
      $("input[name='rating']").on('change', function () {
        const selectedValue = parseInt($(this).val())
    
        resetStarLabel();

        // loop dari 1 sampai nilai terpilih
        for (let i = 1; i <= selectedValue; i++) {
          const label = $(`#rating${i}`).siblings('label.ratting')
          label.find('img:nth-child(1)').hide() // outline
          label.find('img:nth-child(2)').show() // fill
        }
      })
    
      $('button[type=reset]').on('click', function () {
        resetStarLabel();
      })
    })
  </script>
{% endblock %}

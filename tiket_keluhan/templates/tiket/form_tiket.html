{% extends 'form_layout.html' %}
{% block title %}
  Tiket
{% endblock %}

{% block form %}
  <div>
    <form class="mt-3" action="/tiket{% if action == 'update' %}/{{ object.id }}/update{% endif %}" method="POST" enctype="multipart/form-data">
      {% csrf_token %}
      <h3 class="text-center">{% if action == 'update' %}Ubah{% else %}Tambah{%endif%} tiket</h3>
      <div class="row mb-2">
        {{ form.as_p }}
      </div>
      {% if attachment %}
        <div class="mb-3">
          <label for="" class="form-label">File Saat ini:</label>
          <a href="{{ attachment.file.url }}" target="_blank">
            {{ attachment.original_name }}
          </a>
        </div>
      {% endif %}
      <div class="">
        <button style="width: 100%;" class="btn btn-primary w-full">Submit</button>
      </div>
    </form>
  </div>
{% endblock form %}

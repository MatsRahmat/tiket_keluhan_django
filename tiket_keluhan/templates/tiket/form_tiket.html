{% extends 'base_layout.html' %}
{% block title %}
  Tiket
{% endblock %}

{% block base_content %}
  <div class="container">
    <form class="mt-3" action="" method="POST" enctype="multipart/form-data">
      {% csrf_token %}
      <h3 class="text-center">Buat tiket</h3>
      <div class="row mb-2">
        {{ form.as_p }}
      </div>
      {% if attachment %}
        <div class="mb-3">
          <label for="" class="form-label">File Saat ini:</label>
          <a href="{{ attachment.file.url }}" target="_blank">
            {{ attachment.original_name }}
          </a>
        </div>
      {% endif %}
      <div class="d-flex gap-2 justify-content-between">
        <button type="reset" style="width: 100%;" class="btn btn-light border border-dark w-full">Reset</button>
        <button type="submit" style="width: 100%;" class="btn btn-primary border w-full">Submit</button>
      </div>
    </form>
  </div>
{% endblock base_content %}

{% extends 'base_layout.html' %}
{% block title %}
  Tiket
{% endblock %}

{% block content %}
  <div>
    {% if messages %}
      <ul class="messages">
        {% for message in messages %}
          <li class="bg-{{ message.tags }}">{{ message }}</li>
        {% endfor %}
      </ul>
    {% endif %}

    <form class="mt-3" action="/tiket{% if action == 'update' %}/{{ object.id }}/update{% endif %}" method="POST">
      {% csrf_token %}
      <h3 class="text-center">Tambah tiket</h3>
      <div class="row mb-2">
        {{ form.as_p }}
      </div>
      <div class="">
        <button style="width: 100%;" class="btn btn-primary w-full">Submit</button>
      </div>
    </form>
  </div>
{% endblock %}
